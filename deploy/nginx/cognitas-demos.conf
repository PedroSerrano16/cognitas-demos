# /etc/nginx/sites-available/cognitas-demos
#
# Install ONCE, then let certbot own it (see README). The deploy script never
# rewrites this file, because `certbot --nginx` edits it in place to add the
# ssl_certificate lines and the :80 -> :443 redirects. Re-copying the repo's
# copy over the top would strip all of that and break TLS on four hosts.
#
# Four static sites, no application, no proxy_pass. Everything is served from
# the git checkout at /opt/demos.

# Shared hardening — the nginx equivalent of what netlify.toml used to declare.
# Repeated per server block because nginx's add_header does not inherit into a
# block that declares its own.

server {
    listen 80;
    listen [::]:80;
    server_name demos.cognitas.pt;

    root /opt/demos;
    index index.html;

    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # The web root is a git checkout. Without these three rules the whole
    # repository is downloadable, .git history included.
    location ~ /\.        { deny all; }   # .git, .github, .gitignore
    location ^~ /deploy/  { deny all; }
    location = /README.md { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name agenda.cognitas.pt;

    # Static mirror of www.cetomanota.com — see README. The live copy on the
    # server also has the /_next/image and /api/inscricao locations below.
    root /opt/demos/agenda;
    index index.html;
    error_page 404 /404.html;

    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }

    location = /_next/image {
        if ($arg_url !~ "^%2F[A-Za-z0-9_%-]+%2F[A-Za-z0-9_%-]+\.(png|jpg|jpeg|webp|svg)$") { return 404; }
        try_files /_img/$arg_url =404;
    }

    location = /api/inscricao {
        proxy_pass https://www.cetomanota.com;
        proxy_set_header Host www.cetomanota.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.cetomanota.com;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

